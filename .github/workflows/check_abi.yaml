name: Check ABI
on:
  workflow_dispatch:
jobs:
  abi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Build
        run: ./gradlew assembleRelease
      - name: Daftar ABI di APK
        run: |
          APK=$(find . -name '*.apk' | head -1)
          echo "$APK"
          unzip -l "$APK" | grep -oE 'lib/[^/]+/' | sort | uniq -c
          unzip -l "$APK" | grep -E 'lib/' | awk '{print $4}' | sort
